<!DOCTYPE html>
<html lang='ja'>
<head>
    <meta charset="UTF-8">
    {% load static %}
    <link rel="stylesheet" href="{% static 'common/base.css' %}">
    <link rel="stylesheet" href="{% static 'accounts/accounts.css' %}">
    <link rel="stylesheet" href="{% static 'tasks/tasks.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>{% block title %}IMATAS{% endblock %}</title>
</head>

<body>

<header id="header">
    <h1>いまタス</h1>
    {% block header_right %}
    <!-- 右上ボタン（戻る or ×）をページごとに差し込む -->
    {% endblock %}
</header>

<main id="main-content">
    {% block content %}
    {% endblock %}
</main>


{% block footer %}
<!-- 必要なページだけフッターを表示 -->
<footer id="footer">
    <!-- アイコン探して入れる -->
    <nav>
        <a href="{% url 'tasks:home' %}">ホーム</a>
        <a href="{% url 'tasks:task_list' %}">タスク一覧</a>
        <button id="mypageBtn">マイページ</button>
    </nav>
</footer>

{% endblock %}

<!-- マイページパネル -->
<div id="mypagePanel" class="mypage-panel">
    <button id="closeMypage">×</button>
    <a href="{% url 'accounts:my_account' %}">アカウント管理　＞</a>
    <a href="{% url 'accounts:my_remind' %}">通知設定　＞</a>
    <a href="{% url 'accounts:my_conditions' %}">状況管理　＞</a>
    <a href="{% url 'accounts:my_condition_sets' %}">保存状況管理　＞</a>
    <br>
    <a href="#" id="open-logout-modal" class="logout-link">ログアウト</a>
</div>

    <!-- モーダル背景 -->
    <div id="logout-modal-overlay" class="modal-overlay"></div>
    <!-- モーダル本体 -->
    <div id="logout-modal" class="modal">
        <p>ログアウトしますか？</p>
        <div class="modal-buttons">
            <button class="danger" id="logout-yes">はい</button>
            <button class="cancel" id="logout-no">いいえ</button>
        </div>
    </div>
    <form id="logout-form" method="POST" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
    </form>

        <script>
        function closeMypage() {
            document.querySelector('.mypage-panel').classList.remove('open');

            // 状態をリセットする
            localStorage.removeItem('mypageShouldOpenOnReturn');
            localStorage.removeItem('mypageReturnPath');
        }
        
        document.getElementById("mypageBtn").onclick = function() {
            document.getElementById("mypagePanel").classList.add("open");
        };
        // サイドシートを閉める罰×ボタンを押した時
        document.getElementById("closeMypage").addEventListener('click', closeMypage);

        // マイページのリンクを押したときにURLを保存
        document.querySelectorAll('.mypage-panel a').forEach(link => {
                // ログアウトは状態保存しない
                if (link.classList.contains('logout-link')) {
                    return;
                }
                
                link.addEventListener('click', () => {
                // 戻ったときにサイドシートを開くフラグ
                localStorage.setItem('mypageShouldOpenOnReturn', '1');

                // パスだけ保存（URLの細かい違いを無視できる）
                localStorage.setItem('mypageReturnPath', location.pathname);

                // 遷移時はサイドシートを閉じる
                document.getElementById('mypagePanel').classList.remove('open');
            });
        });
        // ページ読み込み時に復元
        window.addEventListener('pageshow', () => {
            const shouldOpen = localStorage.getItem('mypageShouldOpenOnReturn');
            const savedPath = localStorage.getItem('mypageReturnPath');

            if (shouldOpen === '1' && savedPath === location.pathname) {
                document.getElementById('mypagePanel').classList.add('open');
            }
        });

        // ログアウトモーダル
        document.addEventListener("DOMContentLoaded", function() {
            const openBtn = document.getElementById("open-logout-modal");
            const modal = document.getElementById("logout-modal");
            const overlay = document.getElementById("logout-modal-overlay");

            openBtn.addEventListener("click", function(e) {
                e.preventDefault(); // リンクの遷移を止める
                modal.style.display = "block";
                overlay.style.display = "block";
            });

            // いいえボタン
            document.getElementById("logout-no").addEventListener("click", () => {
                modal.style.display = "none";
                overlay.style.display = "none";
            });

            // 背景タップで閉じる
            overlay.addEventListener("click", () => {
                modal.style.display = "none";
                overlay.style.display = "none";
            });

            // はいボタン → ログアウト実行
            document.getElementById("logout-yes").addEventListener("click", () => {
                document.getElementById("logout-form").submit();
            });
        });
        </script>

</body>
</html>
