{% extends "base.html" %}

{% block title %}新しいパスワード{% endblock %}

{% block content %}

<h1>新しいパスワード</h1>

{% if validlink %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">
        パスワードを変更
    </button>
</form>

{% else %}

<p>
このリンクは無効です。<br>
もう一度パスワード再設定を行ってください。
</p>

{% endif %}

{% endblock %}
