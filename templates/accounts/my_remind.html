{% extends "base.html" %}
{% block title %}my_remind Page{% endblock %}
{% block header_right %}
    <button id="headerBackBtn" class="header-btn">←戻る</button>
{% endblock %}

{% block content %}

    <div class="page-title">通知設定</div>

    <form method="POST" class="notify-form">
        {% csrf_token %}

        <!-- ON/OFF -->
        <div class="notify-section">
            <div class="notify-row">
                <span class="notify-label">期限通知を受け取る</span>
                <button type="button" class="toggle-btn action-btn" data-action="remind_enabled_btn">
                    {% if my_account_data.remind_enabled == 0 %}
                        OFF
                    {% else %}
                        ON
                    {% endif %}
                </button>
            </div>

            <p class="notify-desc">
                設定したタイミングに期限を迎える未完了タスクと、
                期限を超過した未完了タスクを通知します
            </p>
        </div>

        <!-- 通知タイミング -->
        <div class="notify-section {% if my_account_data.remind_enabled == 0 %}disabled{% endif %}">
            <span class="notify-label">通知するタイミング</span>

            <div class="notify-options">
                <label><input type="checkbox" class="single-check" value="0" {% if default_remind_day == 0 %}checked{% endif %}> 当日</label>
                <label><input type="checkbox" class="single-check" value="1" {% if default_remind_day == 1 %}checked{% endif %}> 1日前</label>
                <label><input type="checkbox" class="single-check" value="3" {% if default_remind_day == 3 %}checked{% endif %}> 3日前</label>
                <label><input type="checkbox" class="single-check" value="7" {% if default_remind_day == 7 %}checked{% endif %}> 7日前</label>
            </div>
        </div>

        <!-- 通知時間 -->
        <div class="notify-section {% if my_account_data.remind_enabled == 0 %}disabled{% endif %}">
            <span class="notify-label">通知する時間帯</span>
            <input type="time" id="remind_time" name="remind_time"
                value="{{ default_remind_time|time:'H:i' }}" class="time-input">
        </div>

        <!-- 保存 -->
        <button type="button" class="save-btn action-btn {% if my_account_data.remind_enabled == 0 %}disabled-btn{% endif %}"
                data-action="remind_timing_set_btn">
            保存
        </button>
    </form>

    
        <script>
        document.querySelectorAll(".action-btn").forEach(btn => {
            btn.addEventListener("click", function() {
                if (this.classList.contains("disabled-btn")) {
                    return;   // 保存処理を止める
                }

                const action = this.dataset.action;

                // 〇日前；views.pyで受け取れるようにFormData を作成
                const formData = new FormData();
                formData.append("action", action);
                // チェックされている option を追加
                document.querySelectorAll(".single-check").forEach(box => {
                    if (box.checked) {
                        formData.append("option", box.value);
                    }
                });

                // 時間；FormData に追加
                const remindTime = document.getElementById("remind_time").value;
                formData.append("remind_time", remindTime);

                fetch("/accounts/button_clicked/", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {
                        "X-CSRFToken": "{{ csrf_token }}",
                    },
                    body: formData
                })
                .then(response => {
                    if (response.redirected) {
                        window.location.href = response.url;
                    }
                });
            });
        });
        
        document.querySelectorAll(".single-check").forEach(cb => {
            cb.addEventListener("change", function() {
                // 複数選択不可（自分以外を全部 OFF にする）
                document.querySelectorAll(".single-check").forEach(other => {
                    if (other !== this) {
                        other.checked = false;
                    }
                });                
            });
        });
        
        // 戻るボタンを押した時
        document.getElementById('headerBackBtn').addEventListener('click', () => {
            if (history.length > 1) {
            // 1つ前のページに戻る（ブラウザの戻ると同じ）
            history.back();
            } else {
                // 履歴がないときだけホームへ
                window.location.href = '/accounts/home/';
            }
        });
        </script>

{% endblock %}

{% block footer %} {{ block.super }} {% endblock %}
